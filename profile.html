<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fafafa">
<title>حساب کاربری | گیتی رول‌پلی</title>
<style>
:root{--fh:clamp(38px,6vh,52px);--gap:clamp(6px,1.3vh,12px);--bg:#fafafa;--in:#f6f6f6;--line:#e8e8e8;--tx:#111;--mut:#8a8a8a;--dk:#171717;--ok:#22a05a;--bad:#e5484d;--bl:#3b5bff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{width:50%;min-width:290px;max-width:520px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + clamp(20px,5vh,48px)) 22px calc(env(safe-area-inset-bottom) + clamp(20px,5vh,48px));display:flex;flex-direction:column;justify-content:center}
.center{display:flex;flex-direction:column;justify-content:center}
.top{position:fixed;top:max(env(safe-area-inset-top),8px);right:8px;z-index:4}
.back{width:40px;height:40px;display:grid;place-items:center;font-size:24px;color:var(--tx);text-decoration:none}
h1{font-size:clamp(18px,3.1vh,22px);font-weight:700;text-align:center}
.sub{color:var(--mut);font-size:14px;text-align:center}
.tabs{display:flex;background:#f1f1f1;border-radius:14px;padding:4px;margin:clamp(10px,2.2vh,24px) 0 clamp(2px,.8vh,8px);box-shadow:0 1px 6px rgba(0,0,0,.05)}
.tabs button{flex:1;padding:9px;border-radius:11px;color:var(--mut);font-size:14px}
.tabs .on{background:#fff;color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.f{position:relative;display:flex;align-items:center;gap:10px;background:var(--in);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:var(--fh);margin-top:var(--gap);color:#6b6b6b;transition:border-color .15s}
.f:focus-within{border-color:#bbb}
.f.ok{border-color:var(--ok)}.f.ok .ic{color:var(--ok)}
.f.bad{border-color:var(--bad)}
.f input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:15px;color:var(--tx)}
.f input::placeholder{color:#9a9a9a}
.ic,.eye{display:grid;place-items:center;color:#777}
.pre{white-space:nowrap;color:var(--tx);font-size:14px;padding-right:10px;border-right:1px solid var(--line)}
.info{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid #9a9a9a;color:#777;font-size:13px;font-weight:700;line-height:1;display:grid;place-items:center}
.pf{position:relative}
.tip{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.08);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:#555}
.msg{font-size:12px;color:var(--mut);margin:4px 6px 0}
.msg:empty{display:none}
.msg.bad{color:var(--bad)}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin-top:clamp(6px,1.3vh,14px)}
.chk input{width:17px;height:17px;accent-color:var(--dk)}
.chk b{color:var(--tx);font-weight:500}
.chk a{margin-inline-start:auto;color:var(--tx)}
.btn{width:100%;height:var(--fh);margin-top:clamp(10px,1.8vh,18px);background:var(--dk);color:#fff;border-radius:14px;font-size:15px;font-weight:500}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:12.5px;text-align:center;min-height:clamp(14px,2.4vh,22px);margin-top:clamp(2px,.8vh,10px)}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:clamp(6px,1.3vh,14px)}
.foot button{color:var(--tx);font-weight:500}
.foot button:disabled{color:var(--mut);cursor:default;font-weight:400}
.hint{text-align:center;color:var(--mut);font-size:12.5px}
.otp{position:relative;direction:ltr;display:flex;justify-content:center;gap:6px;margin:clamp(12px,3vh,22px) 0 clamp(6px,1.4vh,10px)}
.otp .bx{flex:1;max-width:48px;aspect-ratio:5/6;border-radius:14px;background:var(--in);border:1.5px solid var(--line);display:grid;place-items:center;font-size:22px;font-weight:600;transition:border-color .15s,background .15s,color .15s}
.otp .bx.sp{margin-right:10px}
.otp .bx.act{border-color:var(--bl);background:#fff}
.otp .bx.act:empty:after{content:"";width:2px;height:24px;background:var(--bl);animation:bl 1s steps(1) infinite}
.otp .bx.ok{border-color:var(--ok);background:#effaf3;color:var(--ok);animation:pop .3s ease-out}
.otp.bad{animation:shake .45s}
.otp.bad .bx{border-color:var(--bad);background:#fff3f3;color:var(--bad)}
.otp input{position:absolute;inset:0;width:100%;height:100%;z-index:2;opacity:0;font-size:16px;border:0;background:none;outline:0;caret-color:transparent}
@keyframes bl{50%{opacity:0}}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{width:100%;max-width:420px;background:#fff;border-radius:22px 22px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom) + 22px);animation:up .22s ease-out}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 14px}
.sheet h2{font-size:17px;margin-bottom:4px}
.sheet textarea{width:100%;height:92px;resize:none;background:var(--in);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;margin-top:12px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:10;max-width:90%;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet,.otp.bad,.otp .bx.ok{animation:none}}
@media(max-height:620px){.sub.opt{display:none}}
body.fit{overflow:hidden;height:100dvh}
.wrap.wide{width:100%;min-width:0;max-width:560px;padding:0 0 calc(env(safe-area-inset-bottom) + 28px);justify-content:flex-start}
.pban{height:clamp(96px,20vh,150px);background:linear-gradient(180deg,#8f979e,#d9dee2) center/cover no-repeat;position:relative}
.pback{position:absolute;top:max(env(safe-area-inset-top),14px);right:14px;width:40px;height:40px;border-radius:50%;background:rgba(15,20,25,.65);color:#fff;display:grid;place-items:center}
.pinfo{padding:0 18px}
.pav{width:clamp(84px,14vh,108px);height:clamp(84px,14vh,108px);border-radius:50%;border:4px solid #fff;margin-top:calc(clamp(84px,14vh,108px) / -2);background:linear-gradient(135deg,#2b2b2b,#6b6b6b);color:#fff;font-size:40px;font-weight:700;display:grid;place-items:center;overflow:hidden;position:relative}
.pav img{width:100%;height:100%;object-fit:cover}
.pname{font-size:22px;font-weight:800;margin-top:10px;line-height:1.5}
.pid{color:var(--mut);font-size:15px}
.pbio{margin-top:10px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.pjoin{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;margin-top:10px}
.pbtns{display:flex;gap:10px;margin-top:16px}
.pbtn{flex:1;height:42px;border-radius:999px;border:1.5px solid #dcdcdc;font-weight:700;font-size:15px;background:#fff}
.pbtn:active{background:#f3f3f3}
.ehead{display:flex;align-items:center;gap:12px;padding:max(env(safe-area-inset-top),10px) 14px 10px;position:sticky;top:0;background:#fff;z-index:5}
.ehead b{font-size:19px;font-weight:800;flex:1}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.esave{font-weight:700;font-size:16px;color:#a5a5a5;padding:6px 8px}
.esave.on{color:var(--tx)}
.ebn{height:clamp(104px,20vh,160px);background:#7d8388 center/cover no-repeat;display:grid;place-items:center;color:#fff;cursor:pointer;position:relative}
.eav{width:92px;height:92px;border-radius:50%;border:4px solid #fff;margin:-46px 18px 0;background:linear-gradient(135deg,#4a4f55,#7d8388) center/cover no-repeat;display:grid;place-items:center;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.eav:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.eav svg{position:relative;z-index:1}
.efs{padding:4px 18px 0}
.ef{display:block;padding:14px 0 6px;border-bottom:1px solid #e6e6e6;transition:border-color .2s}
.ef:focus-within{border-color:#111}
.ef>span{display:block;color:#6b7580;font-size:14px}
.ef input,.ef textarea{width:100%;border:0;outline:0;background:none;font-size:17px;padding:4px 0 6px;resize:none;color:var(--tx);transition:opacity .2s}
.ef textarea{height:58px}
.ef.ro{border-bottom-color:#eee}
.ef.ro .v{padding:4px 0 6px;color:#8a8a8a;font-size:17px}
.idrow{display:flex;align-items:center;direction:ltr;gap:2px;font-size:17px}
.idrow i{font-style:normal;color:#6b7580}
.idrow input{direction:ltr;text-align:left}
.ef.na input,.ef.na .idrow i{opacity:.3}
.emsg{display:block;font-style:normal;font-size:12.5px;color:var(--mut)}
.emsg:empty{display:none}
.ef.na .emsg{color:var(--bad)}
.ef.ok .emsg{color:var(--ok)}
.erow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.erow .ef input,.erow .ef.ro .v{font-size:15.5px}
.elink{display:block;width:100%;text-align:right;padding:16px 0;font-size:16px;border-bottom:1px solid #eee}
.elink.red{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const API='https://api.gitirp.ir/api/user';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const I={user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
off:'<path d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5-6M9.9 4.2A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/>'};
I.back='<path d="M5 12h14M13 6l6 6-6 6"/>';I.cal='<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>';I.cam='<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>';
const svg=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
let T=null,U=null,mode='in',ct,pend=null,tick;
try{T=localStorage.getItem('giti_ut')||sessionStorage.getItem('giti_ut')}catch(e){}
const save=(t,keep=true)=>{T=t;try{localStorage.removeItem('giti_ut');sessionStorage.removeItem('giti_ut');if(t)(keep?localStorage:sessionStorage).setItem('giti_ut',t)}catch(e){}};

async function api(p,b){
  let r;
  try{r=await fetch(API+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined})}
  catch(e){throw new Error('اتصال به سرور برقرار نشد. اینترنت را بررسی کن.')}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((d.error||'خطایی رخ داد. دوباره تلاش کن.')+(d.detail?` (${d.detail})`:''));
  return d;
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
const field=(id,ic,ph,type='text')=>`<div class="f" id="f_${id}"><span class="ic">${svg(ic)}</span><input id="${id}" type="${type}" placeholder="${ph}" dir="auto" autocapitalize="none" autocomplete="${type==='password'?(mode==='in'?'current-password':'new-password'):({em:'email'}[id]||'username')}">${type==='password'?`<button type="button" class="eye" aria-label="نمایش رمز">${svg('eye')}</button>`:''}</div>`;
const phoneField=info=>`<div class="pf"><div class="f" id="f_ph" dir="ltr"><span class="pre">🇮🇷 +98</span><input id="ph" type="tel" inputmode="numeric" placeholder="912 345 6789" autocomplete="tel-national" dir="ltr">${info?'<button type="button" class="info" id="inf" aria-label="راهنما">!</button>':''}</div>${info?'<div class="tip" id="tip" hidden>با افزودن شماره، می‌توانید در صورت فراموشی رمز عبور از طریق شماره اقدام به بازیابی رمز عبور کنید.</div>':''}</div>`;
function bindPhone(){
  const el=$('#ph');
  el.oninput=()=>{
    let d=fa(el.value).replace(/\D/g,'');
    if(d.startsWith('0098'))d=d.slice(4);else if(d.startsWith('98'))d=d.slice(2);
    if(d.startsWith('0'))d=d.slice(1);
    d=d.slice(0,10);
    el.value=[d.slice(0,3),d.slice(3,6),d.slice(6)].filter(Boolean).join(' ');
  };
  const i=$('#inf');if(i)i.onclick=()=>{const t=$('#tip');t.hidden=!t.hidden};
}
const phoneVal=()=>{const d=fa($('#ph').value).replace(/\D/g,'');return /^9\d{9}$/.test(d)?'+98'+d:''};
const showPhone=p=>{let d=String(p).replace(/\D/g,'');if(d.startsWith('98'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);return d.length===10?`+98 ${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}`:String(p)};
function bindEye(){document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=b.parentNode.querySelector('input');const h=i.type==='password';i.type=h?'text':'password';b.innerHTML=svg(h?'off':'eye')})}

function setV(o={}){$('#app').className='wrap'+(o.wide?' wide':'');document.body.classList.toggle('fit',!!o.fit);window.scrollTo(0,0)}

function authView(){setV();
  const up=mode==='up';
  $('#app').innerHTML=`
  <div class="top"><a class="back" href="/" aria-label="بازگشت">›</a></div>
  <div class="center">
    <h1>${up?'ساخت حساب':'خوش آمدی'}</h1>
    <p class="sub opt">${up?'یک حساب جدید بساز':'وارد حسابت شو'}</p>
    <div class="tabs"><button class="${up?'':'on'}" data-m="in">ورود</button><button class="${up?'on':''}" data-m="up">ثبت‌نام</button></div>
    ${field('u','user',up?'نام کاربری (حروف کوچک انگلیسی)':'نام کاربری یا ایمیل')}<div class="msg" id="um"></div>
    ${up?field('em','mail','ایمیل (اختیاری)','email')+phoneField(true):''}
    ${field('p','lock','رمز عبور','password')}
    ${up?field('p2','shield','تکرار رمز عبور','password')+`<label class="chk"><input type="checkbox" id="tos"><span>قوانین و حریم خصوصی را <b>می‌پذیرم</b></span></label>`
        :`<div class="chk"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rem" checked>مرا به خاطر بسپار</label><a href="#" id="fg">فراموشی رمز؟</a></div>`}
    <div class="err" id="e"></div>
    <button class="btn" id="go">${up?'ساخت حساب':'ورود'}</button>
    <div class="foot">${up?'قبلاً حساب ساخته‌ای؟':'حساب نداری؟'} <button id="sw">${up?'وارد شو':'ثبت‌نام کن'}</button></div>
  </div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;authView()});
  $('#sw').onclick=()=>{mode=up?'in':'up';authView()};
  bindEye();
  if(up){bindPhone();$('#u').oninput=checkName;$('#em').oninput=e=>{e.target.value=e.target.value.toLowerCase()}}
  else{$('#fg').onclick=e=>{e.preventDefault();forgotView()};$('#u').oninput=e=>{e.target.value=e.target.value.toLowerCase()}}
  $('#go').onclick=submit;
  document.querySelectorAll('.f input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submit()});
}

function checkName(e){
  const raw=e.target.value.toLowerCase(),v=raw.replace(/[^a-z0-9_]/g,''),f=$('#f_u'),m=$('#um');
  e.target.value=v;f.className='f';m.className='msg';m.textContent=raw!==v?'فقط حروف کوچک انگلیسی، عدد و _ مجاز است.':'';clearTimeout(ct);
  if(!v)return;
  if(v.length<3){return}
  ct=setTimeout(async()=>{
    try{
      const d=await api('/check?u='+encodeURIComponent(v));
      if($('#u').value!==v)return;
      if(d.available){f.className='f ok'}
      else{f.className='f bad';m.textContent='پر شده';m.className='msg bad'}
    }catch(_){}
  },400);
}

async function submit(){
  const up=mode==='up',b=$('#go'),er=$('#e');er.textContent='';
  const username=$('#u').value.trim().toLowerCase(),password=$('#p').value;
  if(up){
    if(!/^[a-z0-9_]{3,20}$/.test(username))return er.textContent='نام کاربری باید ۳ تا ۲۰ حرف کوچک انگلیسی، عدد یا _ باشد.';
    if($('#f_u').classList.contains('bad'))return er.textContent='این نام کاربری پر شده.';
    const em=$('#em').value.trim();
    if(em&&!/^\S+@\S+\.\S+$/.test(em))return er.textContent='ایمیل معتبر نیست.';
    if(!phoneVal())return er.textContent='شمارهٔ موبایل را کامل وارد کن. مثال: 912 345 6789';
    if(password!==$('#p2').value)return er.textContent='رمز و تکرار رمز یکی نیستند.';
    if(!$('#tos').checked)return er.textContent='برای ادامه باید قوانین را بپذیری.';
  }
  b.disabled=true;
  try{
    if(up){
      const email=$('#em').value.trim().toLowerCase(),phone=phoneVal();
      await api('/sms/send',{purpose:'signup',phone,username});
      pend={username,password,email,phone};return codeView('signup');
    }
    const d=await api('/login',{username,password});
    save(d.token,$('#rem').checked);U=d.user;profileView();
  }catch(x){er.textContent=x.message;b.disabled=false}
}

function forgotView(){setV({fit:true});
  $('#app').innerHTML=`
  <div class="top"><button class="back" id="bk" aria-label="بازگشت">›</button></div>
  <div class="center">
    <h1>بازیابی رمز</h1>
    <p class="sub">شمارهٔ موبایلی که با آن ثبت‌نام کردی را وارد کن</p>
    <div style="height:10px"></div>
    ${phoneField(false)}
    <div class="err" id="e"></div>
    <button class="btn" id="go">ارسال کد</button>
  </div>`;
  bindPhone();
  $('#bk').onclick=()=>{mode='in';authView()};
  const go=async()=>{
    const er=$('#e'),b=$('#go'),phone=phoneVal();er.textContent='';
    if(!phone)return er.textContent='شمارهٔ موبایل را کامل وارد کن.';
    b.disabled=true;
    try{await api('/sms/send',{purpose:'reset',phone});pend={phone};codeView('reset')}
    catch(x){er.textContent=x.message;b.disabled=false}
  };
  $('#go').onclick=go;$('#ph').onkeydown=e=>{if(e.key==='Enter')go()};
}

function codeView(kind){setV({fit:true});
  const reset=kind==='reset';
  $('#app').innerHTML=`
  <div class="top"><button class="back" id="bk" aria-label="بازگشت">›</button></div>
  <div class="center">
    <h1>${reset?'بازیابی رمز':'تأیید شماره'}</h1>
    <p class="sub">کد ۶ رقمی به <span dir="ltr">${esc(showPhone(pend.phone))}</span> پیامک شد</p>
    <div class="otp" id="otp"><input id="cd" autocomplete="one-time-code" inputmode="numeric" maxlength="6" aria-label="کد تأیید">${[0,1,2,3,4,5].map(i=>`<div class="bx${i==2?' sp':''}"></div>`).join('')}</div>
    <p class="hint">گاهی پیامک چند دقیقه دیر می‌رسد. اگر دوباره کد بگیری، کدهای قبلی هم تا ۱۵ دقیقه معتبرند.</p>
    <div class="err" id="e"></div>
    <div class="foot"><button id="rs" disabled></button></div>
  </div>`;
  const cd=$('#cd'),otp=$('#otp'),bx=[...otp.querySelectorAll('.bx')];let busy=false;
  const paint=()=>{const v=cd.value;bx.forEach((b,i)=>{b.textContent=v[i]||'';b.classList.toggle('act',document.activeElement===cd&&i===Math.min(v.length,5))})};
  cd.onfocus=paint;cd.onblur=paint;
  cd.oninput=async()=>{
    cd.value=fa(cd.value).replace(/\D/g,'').slice(0,6);otp.classList.remove('bad');$('#e').textContent='';paint();
    if(cd.value.length<6||busy)return;
    busy=true;cd.readOnly=true;
    const code=cd.value;
    try{
      await api('/sms/verify',{purpose:kind,phone:pend.phone,code});
      bx.forEach((b,i)=>setTimeout(()=>b.classList.add('ok'),i*70));
      clearInterval(tick);
      await new Promise(r=>setTimeout(r,6*70+450));
      if(reset){pend.code=code;newPassView()}
      else{const d=await api('/register',{...pend,name:pend.username,code});save(d.token,true);U=d.user;profileView()}
    }catch(x){
      bx.forEach(b=>b.classList.remove('ok'));
      if(x.message.startsWith('کد اشتباه')){
        otp.classList.add('bad');
        setTimeout(()=>{otp.classList.remove('bad');cd.value='';cd.readOnly=false;busy=false;paint();cd.focus()},800);
      }else{$('#e').textContent=x.message;cd.value='';cd.readOnly=false;busy=false;paint()}
    }
  };
  $('#bk').onclick=()=>{clearInterval(tick);if(reset)forgotView();else authView()};
  let s=60;const rs=$('#rs');
  const t=()=>{if(s>0){rs.disabled=true;rs.textContent=`ارسال دوباره (${s--} ثانیه)`}else{rs.disabled=false;rs.textContent='ارسال دوباره کد';clearInterval(tick)}};
  clearInterval(tick);t();tick=setInterval(t,1000);
  rs.onclick=async()=>{
    try{await api('/sms/send',{purpose:kind,phone:pend.phone,username:pend.username});s=60;clearInterval(tick);t();tick=setInterval(t,1000);toast('کد دوباره ارسال شد')}
    catch(x){$('#e').textContent=x.message}
  };
  cd.focus();paint();
}

function newPassView(){setV({fit:true});
  mode='fg';
  $('#app').innerHTML=`
  <div class="top"><span class="back"></span></div>
  <div class="center">
    <h1>رمز جدید</h1>
    <p class="sub">شمارهٔ تو تأیید شد. رمز جدید را بنویس.</p>
    <div style="height:10px"></div>
    ${field('p','lock','رمز جدید','password')}${field('p2','shield','تکرار رمز جدید','password')}
    <div class="err" id="e"></div>
    <button class="btn" id="go">عوض کردن رمز</button>
  </div>`;
  bindEye();
  $('#go').onclick=async()=>{
    const er=$('#e'),b=$('#go'),pw=$('#p').value;er.textContent='';
    if(pw.length<6)return er.textContent='رمز باید حداقل ۶ حرف باشد.';
    if(pw!==$('#p2').value)return er.textContent='رمز و تکرار رمز یکی نیستند.';
    b.disabled=true;
    try{await api('/reset',{phone:pend.phone,code:pend.code,password:pw});mode='in';authView();toast('رمز عوض شد. حالا وارد شو.')}
    catch(x){er.textContent=x.message;b.disabled=false}
  };
}

function profileView(u=U){
  setV({wide:true});
  const me=!!(U&&u&&U.username===u.username);
  const ini=esc((u.name||u.username)[0].toUpperCase());
  const since=new Date(u.created_at*1000).toLocaleDateString('fa-IR',{year:'numeric',month:'long'});
  $('#app').innerHTML=`
  <div class="pban" id="pban"><button class="pback" id="pbk" aria-label="بازگشت">${svg('back',22)}</button></div>
  <div class="pinfo">
    <div class="pav">${u.avatar?`<img src="${esc(u.avatar)}" alt="">`:ini}</div>
    <div class="pname">${esc(u.name||u.username)}</div>
    <div class="pid"><bdi>@${esc(u.username)}</bdi></div>
    ${u.bio?`<div class="pbio">${esc(u.bio)}</div>`:''}
    <div class="pjoin">${svg('cal',18)}<span>عضو از ${since}</span></div>
    <div class="pbtns"><button class="pbtn" id="psh">اشتراک‌گذاری</button>${me?'<button class="pbtn" id="ped">ویرایش پروفایل</button>':''}</div>
  </div>`;
  if(u.banner)$('#pban').style.backgroundImage=`url("${u.banner}")`;
  $('#pbk').onclick=()=>{if(!me&&history.length>1)history.back();else location.href='/'};
  $('#psh').onclick=()=>share(u);
  if(me){$('#ped').onclick=editView;history.replaceState(null,'','?u='+encodeURIComponent(u.username))}
}

async function share(u){
  const url=location.origin+location.pathname+'?u='+encodeURIComponent(u.username);
  try{if(navigator.share){await navigator.share({title:(u.name||u.username)+' در گیتی',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('لینک پروفایل کپی شد')}catch(e){prompt('لینک پروفایل:',url)}
}

function notFoundView(){
  setV();
  $('#app').innerHTML=`<div class="top"><a class="back" href="/" aria-label="بازگشت">›</a></div><div class="center"><h1>کاربر پیدا نشد</h1><p class="sub">این آدرس وجود ندارد یا آیدی عوض شده است.</p><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="/">بازگشت به سایت</a></div>`;
}

let EP={},tgt='avatar';
function editView(){
  setV({wide:true});EP={};
  $('#app').innerHTML=`
  <div class="ehead"><button class="ib" id="ebk" aria-label="بازگشت">${svg('back',22)}</button><b>ویرایش پروفایل</b><button class="esave" id="esv" disabled>ذخیره</button></div>
  <div class="ebn" id="ebn" role="button" tabindex="0" aria-label="تغییر بنر">${svg('cam',28)}</div>
  <div class="eav" id="eav" role="button" tabindex="0" aria-label="تغییر عکس">${svg('cam',26)}</div>
  <div class="efs">
    <label class="ef"><span>نام نمایشی</span><input id="en" maxlength="30" value="${esc(U.name)}" dir="auto"></label>
    <label class="ef" id="efu"><span>آیدی</span><div class="idrow"><i>@</i><input id="eu" maxlength="20" value="${esc(U.username)}" autocapitalize="none" autocomplete="off" spellcheck="false"></div><em class="emsg" id="eum"></em></label>
    <label class="ef"><span>بیو</span><textarea id="ebio" maxlength="120" dir="auto">${esc(U.bio)}</textarea></label>
    <div class="erow">
    <div class="ef ro"><span>شماره موبایل</span><div class="v" dir="ltr" style="text-align:right">${U.phone?esc(showPhone(U.phone)):'—'}</div></div>
    <label class="ef"><span>ایمیل (اختیاری)</span><input id="eem" type="email" dir="ltr" style="text-align:right" autocapitalize="none" value="${esc(U.email)}"></label>
    </div>
    <button class="elink" id="epw">تغییر رمز عبور</button>
    <button class="elink red" id="eout">خروج از حساب</button>
  </div>`;
  if(U.banner)$('#ebn').style.backgroundImage=`url("${U.banner}")`;
  if(U.avatar)$('#eav').style.backgroundImage=`url("${U.avatar}")`;
  let okName=true,ct2;
  const val=()=>({name:$('#en').value.trim(),username:$('#eu').value.trim().toLowerCase(),bio:$('#ebio').value.trim(),email:$('#eem').value.trim().toLowerCase()});
  const upd=()=>{
    const x=val();
    const ch=x.name!==U.name||x.username!==U.username||x.bio!==(U.bio||'')||x.email!==(U.email||'')||EP.avatar!==undefined||EP.banner!==undefined;
    const ok=!!x.name&&okName&&/^[a-z0-9_]{3,20}$/.test(x.username);
    $('#esv').disabled=!(ch&&ok);$('#esv').classList.toggle('on',ch&&ok);
  };
  ['en','ebio','eem'].forEach(i=>$('#'+i).oninput=upd);
  $('#eu').oninput=e=>{
    const raw=e.target.value.toLowerCase(),x=raw.replace(/[^a-z0-9_]/g,'');e.target.value=x;
    const f=$('#efu'),m=$('#eum');f.className='ef';okName=true;clearTimeout(ct2);
    m.textContent=raw!==x?'فقط حروف کوچک انگلیسی، عدد و _':'';
    if(x===U.username)return upd();
    if(x.length<3){m.textContent='حداقل ۳ حرف';return upd()}
    okName=false;upd();
    ct2=setTimeout(async()=>{
      try{
        const d=await api('/check?u='+encodeURIComponent(x));
        if($('#eu').value!==x)return;
        if(d.available){f.className='ef ok';m.textContent='در دسترس است';okName=true}
        else{f.className='ef na';m.textContent='در دسترس نیست';okName=false}
      }catch(_){okName=true}
      upd();
    },350);
  };
  const pick=k=>()=>{tgt=k;$('#file').click()};
  $('#ebn').onclick=pick('banner');$('#eav').onclick=pick('avatar');
  $('#ebk').onclick=()=>profileView(U);
  $('#esv').onclick=async()=>{
    const b=$('#esv');b.disabled=true;
    const body={...val()};
    if(EP.avatar!==undefined)body.avatar=EP.avatar;
    if(EP.banner!==undefined)body.banner=EP.banner;
    try{U=(await api('/update',body)).user;profileView(U);toast('ذخیره شد')}
    catch(err){toast(err.message);upd()}
  };
  $('#epw').onclick=()=>sheet('تغییر رمز عبور',`<div class="f"><span class="ic">${svg('lock')}</span><input id="o" type="password" placeholder="رمز فعلی" dir="auto"></div><div class="f"><span class="ic">${svg('lock')}</span><input id="w" type="password" placeholder="رمز جدید" dir="auto"></div>`,async s=>{
    await api('/password',{old:s.querySelector('#o').value,new:s.querySelector('#w').value});toast('رمز عوض شد')});
  $('#eout').onclick=async()=>{try{await api('/logout',{})}catch(e){}save(null);U=null;mode='in';history.replaceState(null,'',location.pathname);authView()};
  upd();
}

function sheet(title,html,onSave){
  const s=document.createElement('div');s.className='shade';
  s.innerHTML=`<div class="sheet"><h2>${title}</h2>${html}<div class="err" id="se"></div><button class="btn" style="margin-top:6px" id="sv">ذخیره</button></div>`;
  document.body.append(s);
  s.onclick=e=>{if(e.target===s)s.remove()};
  const f=s.querySelector('input,textarea');f&&f.focus();
  s.querySelector('#sv').onclick=async()=>{
    const b=s.querySelector('#sv');b.disabled=true;
    try{await onSave(s);s.remove()}catch(e){s.querySelector('#se').textContent=e.message;b.disabled=false}
  };
}

$('#file').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const bn=tgt==='banner',W=bn?900:256,H=bn?300:256;
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const k=Math.max(W/img.width,H/img.height),sw=W/k,sh=H/k;
    c.getContext('2d').drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,W,H);
    const d=c.toDataURL('image/jpeg',.82);
    EP[tgt]=d;
    const el=$(bn?'#ebn':'#eav');if(el)el.style.backgroundImage=`url("${d}")`;
    const sv=$('#esv');if(sv){sv.disabled=false;sv.classList.add('on')}
    URL.revokeObjectURL(img.src);
  };
  img.onerror=()=>toast('این فایل عکس نیست.');
  img.src=URL.createObjectURL(f);
};

(async()=>{
  const q=new URLSearchParams(location.search).get('u');
  if(T){try{U=(await api('/me')).user}catch(e){save(null)}}
  if(q){
    try{const d=await api('/public?u='+encodeURIComponent(q.toLowerCase()));profileView(U&&U.username===d.user.username?U:d.user)}
    catch(e){notFoundView()}
    return;
  }
  if(U)profileView(U);else authView();
})();
</script>
</body>
</html>
