<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GITI ROLE PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --orange-1: #e9860f;
    --orange-2: #c96b0a;
    --orange-deep: #4a2506;
    --ink: #1c1108;
    --panel: #201409;
    --panel-2: #170d05;
    --panel-line: #3a2611;
    --gold: #f2b705;
    --cream: #fbead2;
    --dim: #c79a6d;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    background: var(--ink);
    color: var(--cream);
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
  }

  body{
    background:
      radial-gradient(ellipse 700px 520px at 50% 0%, var(--orange-1) 0%, var(--orange-2) 40%, var(--orange-deep) 74%, var(--ink) 100%);
    background-attachment: fixed;
  }

  a:focus-visible, button:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap{ max-width: 480px; margin: 0 auto; padding: 0 18px 60px; }

  /* top bar */
  .topbar{ display:flex; align-items:center; justify-content:flex-start; padding-top: 16px; }
  .hamburger-btn{
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .hamburger-btn img{ width:18px;height:18px;opacity:0.9; }
  .hamburger-btn:active{ transform: scale(0.92); }

  /* hero */
  .hero{ text-align:center; margin-top: 8px; }
  .logo{ width: 130px; margin: 0 auto; }
  .logo img{ width:100%; display:block; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }

  .eyebrow{
    font-family:'Anton', sans-serif;
    letter-spacing: 4px;
    font-size: 12px;
    color: var(--gold);
    margin-top: 14px;
    direction: ltr;
  }

  h1{
    font-family:'Anton', sans-serif;
    font-size: 34px;
    letter-spacing: 1px;
    color: var(--cream);
    margin-top: 8px;
  }

  .tagline{
    color: var(--dim);
    font-size: 13.5px;
    line-height: 1.9;
    margin-top: 10px;
    padding: 0 10px;
  }

  /* IP block */
  .ip-block{
    margin-top: 26px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
    background: linear-gradient(160deg, var(--panel), var(--panel-2));
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .ip-label{ font-size: 12.5px; color: var(--dim); }
  .ip-value{ font-family:'Anton', sans-serif; font-size: 15px; color: var(--cream); direction: ltr; }
  .ip-badge{
    font-family:'Anton', sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--ink);
    background: var(--gold);
    padding: 5px 10px;
    border-radius: 6px;
    direction: ltr;
  }

  .cta-row{ display:flex; justify-content:center; margin-top: 18px; }
  .cta-store{
    font-family:'Anton', sans-serif;
    font-size: 12.5px;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--gold);
    padding: 12px 26px;
    border-radius: 10px;
    text-decoration: none;
  }
  .cta-store:active{ transform: scale(0.97); }

  /* scroll cue */
  .scroll-cue{
    text-align:center;
    margin-top: 40px;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.6;
  }

  /* news section */
  .news-section{ margin-top: 50px; }

  .news-head h2{
    font-family:'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 0.5px;
    color: var(--cream);
  }
  .news-head p{
    color: var(--dim);
    font-size: 12.5px;
    margin-top: 6px;
    line-height: 1.8;
  }

  .tab-switch{
    display:flex;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 4px;
    gap: 4px;
    margin-top: 18px;
  }
  .tab-btn{
    flex:1;
    text-align:center;
    padding: 10px;
    border-radius: 7px;
    font-family:'Vazirmatn', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .tab-btn.active{ background: var(--gold); color: var(--ink); }

  .chip-row{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 14px;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink: 0;
    padding: 7px 15px;
    border-radius: 20px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--dim);
    font-family:'Vazirmatn', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
  .chip.active{ background: rgba(242,183,5,0.14); border-color: var(--gold); color: var(--gold); font-weight:600; }

  .article-list{
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    margin-top: 8px;
    padding: 6px 2px 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .article-list::-webkit-scrollbar{ display: none; }

  .article-card{
    flex: 0 0 84%;
    scroll-snap-align: start;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    overflow: hidden;
  }

  .article-author{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px 10px;
  }
  .article-author img{
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--ink);
    padding: 4px;
    flex-shrink: 0;
  }
  .article-author-name{
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--cream);
  }
  .verified-badge{
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .verified-badge svg{ width: 8px; height: 8px; }
  .article-author-meta{ font-size: 10.5px; color: var(--dim); margin-top: 2px; }

  .article-image{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: repeating-linear-gradient(135deg, #241708, #241708 10px, #1a1108 10px, #1a1108 20px);
    overflow: hidden;
  }

  .no-image-watermark{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(251,234,208,0.18);
    font-family: 'Anton', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    text-align: center;
    padding: 0 20px;
    transform: rotate(-8deg);
  }

  .article-photo{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .bookmark-btn{
    position: absolute;
    bottom: 14px; left: 14px;
    width: 34px; height: 34px;
    border-radius: 8px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 3;
    flex-shrink: 0;
  }
  .bookmark-btn svg{ width: 15px; height: 15px; stroke: var(--cream); }
  .bookmark-btn.saved svg{ fill: var(--gold); stroke: var(--gold); }

  .image-gradient{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 40px 14px 14px;
    z-index: 2;
  }

  .cat-badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.35);
    padding: 4px 10px 4px 5px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--cream);
    margin-bottom: 8px;
  }
  .cat-badge .dot{
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 8px;
    color: var(--ink);
    flex-shrink: 0;
  }

  .article-title{
    font-weight: 800;
    font-size: 15.5px;
    color: #fff;
    line-height: 1.5;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .article-excerpt{
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    line-height: 1.8;
    margin-top: 6px;
    padding-left: 44px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }


  .empty-articles{
    text-align:center;
    color: var(--dim);
    font-size: 13px;
    padding: 40px 10px;
    flex: 0 0 100%;
  }

  /* hamburger menu sheet (same pattern as store) */
  .menu-backdrop{
    position: fixed; inset:0; background: rgba(0,0,0,0.6);
    z-index: 70; opacity:0; pointer-events:none; transition: opacity .25s ease;
  }
  .menu-backdrop.show{ opacity:1; pointer-events:auto; }

  .menu-sheet{
    position: fixed; left:0; right:0; bottom:0;
    max-width: 480px; margin: 0 auto; max-height: 70vh;
    background: linear-gradient(160deg, var(--panel), #170d05);
    border: 1px solid var(--panel-line); border-bottom:none;
    border-radius: 20px 20px 0 0;
    z-index: 80;
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.2,.8,.25,1);
    overflow: hidden;
  }
  .menu-sheet.show{ transform: translateY(0); }

  .menu-handle{ width:36px; height:4px; border-radius:3px; background:var(--panel-line); margin: 10px auto 6px; }

  .menu-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 14px 14px;
    border-bottom: 1px solid var(--panel-line);
  }
  .menu-title{ font-family:'Anton', sans-serif; font-size:14px; color:var(--cream); }
  .menu-close{
    width:30px;height:30px;border-radius:8px;background:transparent;border:none;
    color:var(--dim); font-size:15px; cursor:pointer;
  }

  .menu-body{ padding: 8px 12px 24px; }
  .menu-item{
    display:flex; align-items:center; gap:12px; width:100%;
    background:transparent; border:none; padding:14px 10px;
    color:var(--cream); font-family:'Vazirmatn'; font-size:14px; font-weight:500;
    cursor:pointer; border-radius:10px; text-align:right; text-decoration:none;
  }
  .menu-item:active{ background: rgba(255,255,255,0.05); }
  .menu-item .chev{ margin-inline-start:auto; color:var(--dim); font-size:14px; transform:rotate(180deg); }
  .menu-divider{ height:1px; background:var(--panel-line); margin:6px 4px; }
  .menu-view[hidden]{ display:none; }
  .menu-spacer{ width:30px; flex-shrink:0; }
  .menu-back{
    width:30px;height:30px;border-radius:8px;background:transparent;border:none;
    color:var(--cream); font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .chev-back{ transform: rotate(0deg); display:inline-block; }

  .saved-list{ margin-top: 14px; display:flex; flex-direction:column; gap:10px; }
  .saved-row{
    display:flex; align-items:center; gap:10px;
    padding: 12px; border:1px solid var(--panel-line); border-radius:10px;
    background: rgba(255,255,255,0.02);
  }
  .saved-row-badge{
    width:34px;height:34px;border-radius:8px; flex-shrink:0;
    background: var(--panel-2); display:flex;align-items:center;justify-content:center;
    font-family:'Anton'; font-size:11px; color:var(--gold);
  }
  .saved-row-body{ flex:1; min-width:0; }
  .saved-row-title{ font-size:12.5px; color:var(--cream); font-weight:600; line-height:1.5; }
  .saved-row-meta{ font-size:10.5px; color:var(--dim); margin-top:3px; }
  .saved-row-remove{
    width:28px;height:28px;border-radius:7px;background:transparent;border:none;
    color:var(--dim); font-size:14px; cursor:pointer; flex-shrink:0;
  }

  .footer{
    margin-top: 40px;
    text-align:center;
    border-top: 1px solid var(--panel-line);
    padding-top: 20px;
  }
  .footer-row{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .social-btn{
    width:42px;height:42px;border-radius:12px;background:var(--panel);
    border:1px solid var(--panel-line); display:flex;align-items:center;justify-content:center;
  }
  .social-btn img{ width:19px;height:19px;opacity:0.9; }
  .footer-tag{ margin-top:16px; font-size:10px; letter-spacing:2px; color:var(--dim); opacity:0.5; }

  /* full-screen article reader */
  .reader-overlay{
    position: fixed; inset: 0; z-index: 90;
    background: var(--ink);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(.2,.8,.25,1);
    display: flex; flex-direction: column;
  }
  .reader-overlay.show{ transform: translateX(0); }

  .reader-header{
    flex-shrink: 0;
    display: flex; justify-content: flex-end;
    padding: 14px 16px;
    border-bottom: 1px solid var(--panel-line);
    background: var(--ink);
  }
  .reader-close{
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--panel-line);
    color: var(--cream); font-size: 16px; cursor: pointer;
  }

  .reader-body{
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 20px 60px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  .reader-cover{
    width: 100%; border-radius: 14px; margin-bottom: 18px; display:block;
  }
  .reader-eyebrow{
    font-family:'Anton', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--gold);
  }
  .reader-title{
    font-family:'Anton', sans-serif; font-size: 24px; color: var(--cream);
    margin-top: 8px; line-height: 1.4;
  }
  .reader-excerpt{
    color: var(--dim); font-size: 13.5px; margin-top: 10px; line-height: 1.9;
  }
  .reader-meta{ font-size: 11px; color: var(--dim); opacity:0.7; margin-top: 10px; }
  .reader-rule{ height:1px; background: var(--panel-line); margin: 18px 0; }

  .rb-heading{
    font-family:'Anton', sans-serif; font-size: 17px; color: var(--cream);
    margin: 20px 0 8px; line-height: 1.5;
  }
  .rb-paragraph{
    font-size: 14px; color: var(--cream); opacity: 0.9; line-height: 2.1; margin: 10px 0;
  }
  .rb-image{ width: 100%; border-radius: 12px; margin: 14px 0; display:block; }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <button class="hamburger-btn" id="hamburgerBtn"><img src="icon-hamburger.png" alt="منو"></button>
  </div>

  <div class="hero">
    <div class="logo"><img src="logo.png" alt="GITI Role Play"></div>
    <div class="eyebrow">SAMP ROLEPLAY SERVER</div>
    <h1>گیتی رول‌پلی</h1>
    <p class="tagline">تجربه‌ی چندنفره‌ی Grand Theft Auto: San Andreas، در کنار دوستانت.</p>
  </div>

  <div class="ip-block">
    <span class="ip-label">IP سرور:</span>
    <span class="ip-value">—</span>
    <span class="ip-badge">COMING SOON</span>
  </div>

  <div class="cta-row">
    <a class="cta-store" href="https://store.gitirp.ir">ورود به فروشگاه</a>
  </div>

  <div class="scroll-cue">اخبار و آپدیت‌ها ↓</div>

  <div class="news-section">
    <div class="news-head">
      <h2>اخبار و آپدیت‌ها</h2>
      <p>آخرین تغییرات و اعلامیه‌های مربوط به سایت، سرور و فروشگاه.</p>
    </div>

    <div class="tab-switch" id="mainTabSwitch">
      <button class="tab-btn active" data-type="news">اخبار</button>
      <button class="tab-btn" data-type="update">آپدیت‌ها</button>
    </div>

    <div class="chip-row">
      <button class="chip active" data-cat="all">همه</button>
      <button class="chip" data-cat="site">سایت</button>
      <button class="chip" data-cat="server">سرور</button>
      <button class="chip" data-cat="shop">فروشگاه</button>
    </div>

    <div class="article-list" id="articleList">
      <!-- injected by JS -->
    </div>
  </div>

  <div class="footer">
    <div class="footer-row">
      <a class="social-btn" data-social="telegram" href="#"><img src="icon-telegram.png" alt="Telegram"></a>
      <a class="social-btn" data-social="instagram" href="#"><img src="icon-instagram.png" alt="Instagram"></a>
      <a class="social-btn" data-social="youtube" href="#"><img src="icon-youtube.png" alt="YouTube"></a>
      <a class="social-btn" data-social="discord" href="#"><img src="icon-discord.png" alt="Discord"></a>
    </div>
    <div class="footer-tag">GITI ROLE PLAY</div>
  </div>

</div>

<div class="menu-backdrop" id="menuBackdrop"></div>
<div class="menu-sheet" id="menuSheet">
  <div class="menu-handle"></div>

  <div class="menu-view" data-view="main">
    <div class="menu-header">
      <span class="menu-spacer"></span>
      <span class="menu-title">منو</span>
      <button class="menu-close" id="menuClose">✕</button>
    </div>
    <div class="menu-body">
      <a class="menu-item" href="https://store.gitirp.ir">
        <span>فروشگاه</span>
        <span class="chev">‹</span>
      </a>
      <button class="menu-item" data-goto="saved">
        <span>ذخیره‌شده‌ها</span>
        <span class="chev">‹</span>
      </button>
      <div class="menu-divider"></div>
      <a class="menu-item" href="admin.html">
        <span>ورود مدیران</span>
        <span class="chev">‹</span>
      </a>
    </div>
  </div>

  <div class="menu-view" data-view="saved" hidden>
    <div class="menu-header">
      <button class="menu-back" data-back="main"><span class="chev-back">›</span></button>
      <span class="menu-title">ذخیره‌شده‌ها</span>
      <span class="menu-spacer"></span>
    </div>
    <div class="menu-body">
      <div class="tab-switch" id="savedTabSwitch">
        <button class="tab-btn active" data-savetype="news">اخبار</button>
        <button class="tab-btn" data-savetype="update">آپدیت‌ها</button>
      </div>
      <div id="savedList" class="saved-list"></div>
    </div>
  </div>

</div>

<div class="reader-overlay" id="readerOverlay">
  <div class="reader-header">
    <button class="reader-close" id="readerClose">✕</button>
  </div>
  <div class="reader-body" id="readerBody"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot, orderBy, query
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0oH5tB6CUiy_d-_XqtIhu_uY1xwLluNE",
    authDomain: "giti-roleplay.firebaseapp.com",
    projectId: "giti-roleplay",
    storageBucket: "giti-roleplay.firebasestorage.app",
    messagingSenderId: "3264333771",
    appId: "1:3264333771:web:5e3b889685765004ccd84e"
  };
  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);

  const socialLinks = {
    telegram:  "https://t.me/GitiRolePlay",
    instagram: "https://www.instagram.com/gitirpofficial?igsh=YW43NWh0YmZlbTZu",
    youtube:   "https://youtube.com/@gitirp?si=hdAkUo8BNQbCBGmJ",
    discord:   "https://discord.gg/BP2UtCbPe",
  };
  document.querySelectorAll(".social-btn").forEach(el => {
    const key = el.getAttribute("data-social");
    if (key && socialLinks[key]) el.href = socialLinks[key];
  });

  // hamburger menu
  const menuBackdrop = document.getElementById("menuBackdrop");
  const menuSheet = document.getElementById("menuSheet");
  const menuViews = document.querySelectorAll(".menu-view");

  function showMenuView(name){
    menuViews.forEach(v => { v.hidden = (v.getAttribute("data-view") !== name); });
    if (name === "saved") renderSaved();
  }
  document.getElementById("hamburgerBtn").addEventListener("click", () => {
    showMenuView("main");
    menuBackdrop.classList.add("show");
    menuSheet.classList.add("show");
  });
  document.getElementById("menuClose").addEventListener("click", closeMenu);
  menuBackdrop.addEventListener("click", closeMenu);
  function closeMenu(){
    menuBackdrop.classList.remove("show");
    menuSheet.classList.remove("show");
  }
  document.querySelectorAll(".menu-item[data-goto]").forEach(btn => {
    btn.addEventListener("click", () => showMenuView(btn.getAttribute("data-goto")));
  });
  document.querySelectorAll(".menu-back[data-back]").forEach(btn => {
    btn.addEventListener("click", () => showMenuView(btn.getAttribute("data-back")));
  });

  // --- live content, loaded from Firestore (edited from admin.html) ---
  let articles = [];

  // A rotating set of overlay tints so cards don't all look identical.
  const overlayTints = [
    "linear-gradient(180deg, transparent 0%, rgba(58,20,10,0.55) 45%, rgba(42,15,8,0.94) 100%)",
    "linear-gradient(180deg, transparent 0%, rgba(20,40,58,0.55) 45%, rgba(12,24,36,0.94) 100%)",
    "linear-gradient(180deg, transparent 0%, rgba(58,42,10,0.55) 45%, rgba(40,28,8,0.94) 100%)",
    "linear-gradient(180deg, transparent 0%, rgba(30,20,50,0.55) 45%, rgba(20,14,34,0.94) 100%)",
  ];

  const icons = {
    bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>',
  };

  // --- saved articles (persisted on this device) ---
  const SAVED_KEY = "giti_saved_articles";
  function getSavedIds(){
    try { return JSON.parse(localStorage.getItem(SAVED_KEY) || "[]"); }
    catch(e){ return []; }
  }
  function toggleSaved(id){
    let ids = getSavedIds();
    if (ids.includes(id)) ids = ids.filter(x => x !== id);
    else ids.push(id);
    localStorage.setItem(SAVED_KEY, JSON.stringify(ids));
    return ids;
  }

  function articleCardHTML(a, tintIndex){
    const saved = getSavedIds().includes(a.id);
    const imageBlock = a.imageUrl
      ? `<img class="article-photo" src="${a.imageUrl}" alt="">`
      : `<div class="no-image-watermark">تصویر موجود نیست</div>`;
    return `
      <div class="article-card" data-open="${a.id}">
        <div class="article-author">
          <img src="logo.png" alt="">
          <div>
            <div class="article-author-name">GITI ROLE PLAY <span class="verified-badge">${icons.check}</span></div>
            <div class="article-author-meta">${a.date || ""}</div>
          </div>
        </div>
        <div class="article-image">
          ${imageBlock}
          <button class="bookmark-btn ${saved ? "saved" : ""}" data-id="${a.id}" aria-label="ذخیره">${icons.bookmark}</button>
          <div class="image-gradient" style="background:${overlayTints[tintIndex % overlayTints.length]}">
            <span class="cat-badge"><span class="dot">G</span>${a.label}</span>
            <div class="article-title">${a.title}</div>
            <div class="article-excerpt">${a.excerpt}</div>
          </div>
        </div>
      </div>
    `;
  }

  function bindBookmarkButtons(container){
    container.querySelectorAll(".bookmark-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const ids = toggleSaved(btn.getAttribute("data-id"));
        btn.classList.toggle("saved", ids.includes(btn.getAttribute("data-id")));
        if (typeof renderSaved === "function") renderSaved();
      });
    });
  }

  function bindCardOpen(container){
    container.querySelectorAll(".article-card[data-open]").forEach(card => {
      card.addEventListener("click", () => openArticle(card.getAttribute("data-open")));
    });
  }

  let currentType = "news";
  let currentCat = "all";

  const articleList = document.getElementById("articleList");

  function renderArticles(){
    const filtered = articles.filter(a =>
      a.type === currentType && (currentCat === "all" || a.cat === currentCat)
    );
    if (filtered.length === 0){
      articleList.innerHTML = '<div class="empty-articles">موردی برای نمایش وجود ندارد.</div>';
      return;
    }
    articleList.innerHTML = filtered.map((a, i) => articleCardHTML(a, i)).join("");
    bindBookmarkButtons(articleList);
    bindCardOpen(articleList);
  }

  // --- full-screen reader ---
  const readerOverlay = document.getElementById("readerOverlay");
  const readerBody = document.getElementById("readerBody");
  const readerClose = document.getElementById("readerClose");

  function blockHTML(b){
    if (b.type === "heading") return `<div class="rb-heading">${b.text || ""}</div>`;
    if (b.type === "image") return b.url ? `<img class="rb-image" src="${b.url}" alt="">` : "";
    return `<div class="rb-paragraph">${b.text || ""}</div>`;
  }

  function openArticle(id){
    const a = articles.find(x => x.id === id);
    if (!a) return;
    const cover = a.imageUrl ? `<img class="reader-cover" src="${a.imageUrl}" alt="">` : "";
    const blocks = (Array.isArray(a.blocks) ? a.blocks : []).map(blockHTML).join("");
    readerBody.innerHTML = `
      ${cover}
      <div class="reader-eyebrow">${a.label || ""}</div>
      <div class="reader-title">${a.title || ""}</div>
      ${a.excerpt ? `<div class="reader-excerpt">${a.excerpt}</div>` : ""}
      <div class="reader-meta">${a.date || ""}</div>
      <div class="reader-rule"></div>
      ${blocks}
    `;
    readerBody.scrollTop = 0;
    readerOverlay.classList.add("show");
    history.pushState({ reader: true }, "", "#article-" + id);
  }

  function closeArticle(){
    readerOverlay.classList.remove("show");
  }

  readerClose.addEventListener("click", () => {
    if (history.state && history.state.reader) history.back();
    else closeArticle();
  });

  window.addEventListener("popstate", (e) => {
    if (!(e.state && e.state.reader)) closeArticle();
  });

  document.querySelectorAll("#mainTabSwitch .tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#mainTabSwitch .tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentType = btn.getAttribute("data-type");
      renderArticles();
    });
  });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentCat = chip.getAttribute("data-cat");
      renderArticles();
    });
  });

  const articlesQuery = query(collection(db, "articles"), orderBy("createdAt", "desc"));
  onSnapshot(articlesQuery, (snap) => {
    articles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderArticles();
    if (typeof renderSaved === "function") renderSaved();
  }, (err) => {
    articleList.innerHTML = '<div class="empty-articles">اتصال به سرور اخبار ناموفق بود.</div>';
  });

  // --- saved-articles view (inside hamburger menu) ---
  let savedType = "news";
  const savedList = document.getElementById("savedList");

  function renderSaved(){
    const ids = getSavedIds();
    const items = articles.filter(a => ids.includes(a.id) && a.type === savedType);
    if (items.length === 0){
      savedList.innerHTML = '<div class="empty-articles">چیزی ذخیره نکردی.</div>';
      return;
    }
    savedList.innerHTML = items.map(a => `
      <div class="saved-row">
        <span class="saved-row-badge">${a.label.slice(0,1)}</span>
        <div class="saved-row-body">
          <div class="saved-row-title">${a.title}</div>
          <div class="saved-row-meta">${a.label} · ${a.date}</div>
        </div>
        <button class="saved-row-remove" data-id="${a.id}" aria-label="حذف">${icons.bookmark}</button>
      </div>
    `).join("");
    savedList.querySelectorAll(".saved-row-remove").forEach(btn => {
      btn.addEventListener("click", () => {
        toggleSaved(btn.getAttribute("data-id"));
        renderSaved();
        renderArticles();
      });
    });
  }

  document.querySelectorAll("#savedTabSwitch .tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#savedTabSwitch .tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      savedType = btn.getAttribute("data-savetype");
      renderSaved();
    });
  });
</script>

</body>
</html>
